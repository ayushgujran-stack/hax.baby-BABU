<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%">
  <defs>
    <filter id="paci-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="0" flood-color="#292521" />
    </filter>
  </defs>
  <!-- Nipple / Bulb behind shield -->
  <path d="M 40 28 C 30 12 50 12 40 28 Z" fill="#FFF1D6" stroke="#292521" stroke-width="2" opacity="0.9"/>
  <!-- Outer Shield Ring -->
  <path d="M 18 42 C 14 26 30 24 40 28 C 50 24 66 26 62 42 C 60 52 48 56 40 52 C 32 56 20 52 18 42 Z" 
        fill="#55B9F5" stroke="#292521" stroke-width="3" stroke-linejoin="round" filter="url(#paci-shadow)"/>
  <!-- Two Ventilation Heart/Star Holes -->
  <ellipse cx="28" cy="40" rx="3.5" ry="4.5" fill="#FFF8E8" stroke="#292521" stroke-width="1.8"/>
  <ellipse cx="52" cy="40" rx="3.5" ry="4.5" fill="#FFF8E8" stroke="#292521" stroke-width="1.8"/>
  <!-- Central Button Knob -->
  <circle cx="40" cy="40" r="10" fill="#FFD84D" stroke="#292521" stroke-width="2.5"/>
  <!-- Gold star in center -->
  <polygon points="40,34 42,38 46,38 43,41 44,45 40,43 36,45 37,41 34,38 38,38" fill="#AA2F59" stroke="#292521" stroke-width="1"/>
  <!-- Pacifier Ring Handle -->
  <path d="M 32 48 C 32 62 48 62 48 48" fill="none" stroke="#292521" stroke-width="4" stroke-linecap="round"/>
  <path d="M 32 48 C 32 62 48 62 48 48" fill="none" stroke="#FF719A" stroke-width="2.2" stroke-linecap="round"/>
</svg>