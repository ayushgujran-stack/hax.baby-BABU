<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="100%" height="100%">
  <defs>
    <!-- Paper texture & Cardboard drop shadow -->
    <filter id="tommy-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="0" flood-color="#292521" />
    </filter>
  </defs>

  <!-- Tail (animated with CSS rotation) -->
  <g id="tommy-tail" style="transform-origin: 45px 125px;">
    <!-- Fluffy Golden Retriever tail layered cardboard curves -->
    <path d="M 48 125 C 30 115 15 90 28 65 C 38 75 42 95 56 115 Z" fill="#E5B263" stroke="#292521" stroke-width="2.5" stroke-linejoin="round" filter="url(#tommy-shadow)"/>
    <path d="M 32 80 C 22 72 25 60 30 55 C 38 68 40 80 48 95 Z" fill="#F3CA8A" stroke="#292521" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- Back Left Leg & Paw -->
  <g id="tommy-leg-bl" style="transform-origin: 70px 140px;">
    <ellipse cx="72" cy="155" rx="16" ry="22" fill="#D99E4B" stroke="#292521" stroke-width="2.5"/>
    <path d="M 62 172 Q 72 182 82 172" fill="#E5B263" stroke="#292521" stroke-width="2.5"/>
    <!-- Paw toes -->
    <line x1="68" y1="170" x2="68" y2="177" stroke="#292521" stroke-width="2"/>
    <line x1="76" y1="170" x2="76" y2="177" stroke="#292521" stroke-width="2"/>
  </g>

  <!-- Main Fluffy Body (Layered Cardboard Golden Coat) -->
  <g id="tommy-body">
    <!-- Base body shape -->
    <path d="M 65 145 C 55 110 75 90 105 85 C 135 80 160 95 165 130 C 170 150 155 165 125 165 C 90 165 72 160 65 145 Z" 
          fill="#E5B263" stroke="#292521" stroke-width="3" stroke-linejoin="round" filter="url(#tommy-shadow)"/>
    
    <!-- Chest Fluff layered shreds -->
    <path d="M 130 95 C 150 110 160 130 145 150 C 138 140 140 125 130 115 Z" fill="#F9DCAD" stroke="#292521" stroke-width="2"/>
    <path d="M 115 105 C 130 120 135 140 125 155 C 118 145 120 130 112 120 Z" fill="#FFF1D6" stroke="#292521" stroke-width="1.8"/>

    <!-- Sheriff Star Badge (Tommy's signature from the scrapbook!) -->
    <g transform="translate(122, 126) rotate(6)">
      <!-- Tape holding star badge -->
      <rect x="-14" y="-8" width="28" height="8" fill="rgba(255, 248, 232, 0.85)" stroke="#292521" stroke-width="1.2" transform="rotate(-4)"/>
      <!-- Star -->
      <polygon points="0,-14 4,-4 14,-4 6,3 9,13 0,7 -9,13 -6,3 -14,-4 -4,-4" 
               fill="#C89B68" stroke="#292521" stroke-width="1.8"/>
      <!-- Tiny star text -->
      <text x="0" y="2" font-family="sans-serif" font-size="4" font-weight="900" text-anchor="middle" fill="#292521">CSO</text>
    </g>
  </g>

  <!-- Front Left Leg -->
  <g id="tommy-leg-fl" style="transform-origin: 110px 135px;">
    <path d="M 102 135 L 98 175 Q 106 182 114 175 L 118 135 Z" fill="#E5B263" stroke="#292521" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="103" y1="170" x2="103" y2="178" stroke="#292521" stroke-width="1.8"/>
    <line x1="109" y1="170" x2="109" y2="178" stroke="#292521" stroke-width="1.8"/>
  </g>

  <!-- Front Right Running Leg -->
  <g id="tommy-leg-fr" style="transform-origin: 145px 135px;">
    <path d="M 138 135 L 144 176 Q 152 183 160 176 L 154 135 Z" fill="#F3CA8A" stroke="#292521" stroke-width="2.5" stroke-linejoin="round" filter="url(#tommy-shadow)"/>
    <line x1="148" y1="171" x2="148" y2="179" stroke="#292521" stroke-width="1.8"/>
    <line x1="155" y1="171" x2="155" y2="179" stroke="#292521" stroke-width="1.8"/>
  </g>

  <!-- Head & Cute Puppy Face -->
  <g id="tommy-head" style="transform-origin: 155px 75px;">
    <!-- Back Ear (Fluffy Droop) -->
    <path d="M 140 45 C 130 30 115 45 120 75 C 122 88 132 92 136 85 C 140 75 142 55 140 45 Z" 
          fill="#C28732" stroke="#292521" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Main Head Circle with Fur Tuft Points -->
    <path d="M 140 55 C 145 35 170 32 185 45 C 198 55 205 75 198 95 C 192 110 175 115 155 110 C 140 105 135 85 138 65 Z" 
          fill="#E5B263" stroke="#292521" stroke-width="3" stroke-linejoin="round" filter="url(#tommy-shadow)"/>

    <!-- Forehead Cardboard Highlights -->
    <path d="M 155 45 C 165 40 178 42 185 52 C 180 58 168 55 155 45 Z" fill="#F9DCAD" stroke="#292521" stroke-width="1.5"/>

    <!-- Front Floppy Ear -->
    <path d="M 182 45 C 198 42 215 55 210 88 C 205 105 190 108 185 95 C 180 82 182 60 182 45 Z" 
          fill="#D99E4B" stroke="#292521" stroke-width="2.5" stroke-linejoin="round" filter="url(#tommy-shadow)"/>
    <path d="M 188 55 C 198 56 204 70 200 88 C 194 80 190 70 188 55 Z" fill="#F3CA8A"/>

    <!-- Snout & Mouth (Smiling, panting playfully!) -->
    <ellipse cx="188" cy="85" rx="20" ry="16" fill="#F9DCAD" stroke="#292521" stroke-width="2.5"/>
    
    <!-- Big Shiny Black Dog Nose -->
    <path d="M 186 73 C 180 73 178 80 184 84 C 188 87 196 87 200 84 C 204 80 200 73 194 73 Z" fill="#292521"/>
    <circle cx="188" cy="76" r="2" fill="#FFFFFF"/>

    <!-- Tongue panting happily -->
    <path id="tommy-tongue" d="M 184 94 C 184 106 198 106 198 94 Z" fill="#FF719A" stroke="#292521" stroke-width="2"/>

    <!-- Cute Big Shiny Eyes -->
    <!-- Left Eye -->
    <circle cx="162" cy="65" r="7" fill="#292521"/>
    <circle cx="160" cy="63" r="2.5" fill="#FFFFFF"/>
    <circle cx="164" cy="67" r="1.2" fill="#FFFFFF"/>

    <!-- Right Eye -->
    <circle cx="182" cy="66" r="7.5" fill="#292521"/>
    <circle cx="180" cy="64" r="2.8" fill="#FFFFFF"/>
    <circle cx="184" cy="68" r="1.3" fill="#FFFFFF"/>

    <!-- Playful Eyebrows -->
    <path d="M 156 55 Q 163 50 169 54" fill="none" stroke="#8F5B1E" stroke-width="3" stroke-linecap="round"/>
    <path d="M 177 55 Q 183 50 189 55" fill="none" stroke="#8F5B1E" stroke-width="3" stroke-linecap="round"/>

    <!-- Whiskers / Cute dots -->
    <circle cx="177" cy="86" r="1" fill="#8F5B1E"/>
    <circle cx="180" cy="89" r="1" fill="#8F5B1E"/>
    <circle cx="198" cy="86" r="1" fill="#8F5B1E"/>
    <circle cx="195" cy="89" r="1" fill="#8F5B1E"/>
  </g>
</svg>