<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <filter id="mom-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="0" flood-color="#292521" />
    </filter>
  </defs>

  <!-- Cozy Wooden Armchair / Rocking Chair Back -->
  <g id="mom-chair">
    <!-- Wood slats -->
    <path d="M 40 110 L 40 220 M 55 90 L 55 220 M 70 85 L 70 220" stroke="#C89B68" stroke-width="4" stroke-linecap="round"/>
    <!-- Backrest cushion -->
    <path d="M 35 100 Q 55 70 75 95 L 75 210 Q 55 215 35 210 Z" fill="#F5ECE6" stroke="#292521" stroke-width="2.5" filter="url(#mom-shadow)"/>
    <!-- Chair leg & runner -->
    <path d="M 30 225 Q 75 235 120 225" fill="none" stroke="#C89B68" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Mom Body / Cozy Oversized Hoodie (Default Worker #001) -->
  <g id="mom-body">
    <!-- Grey melange hoodie body -->
    <path d="M 50 145 C 50 115 80 110 115 110 C 145 110 155 135 150 185 C 148 210 135 220 95 220 C 60 220 50 190 50 145 Z" 
          fill="#9E9E9E" stroke="#292521" stroke-width="3" stroke-linejoin="round" filter="url(#mom-shadow)"/>
    
    <!-- Sweatpants -->
    <path d="M 70 215 L 70 232 Q 85 236 95 232 L 95 215 Z" fill="#574145" stroke="#292521" stroke-width="2.5"/>
    <path d="M 105 215 L 105 232 Q 120 236 130 232 L 130 215 Z" fill="#574145" stroke="#292521" stroke-width="2.5"/>
    <!-- Fuzzy house slippers -->
    <ellipse cx="82" cy="234" rx="14" ry="6" fill="#FFF8E8" stroke="#292521" stroke-width="2"/>
    <ellipse cx="118" cy="234" rx="14" ry="6" fill="#FFF8E8" stroke="#292521" stroke-width="2"/>

    <!-- Sticky note on hoodie 'DEFAULT WORKER 001' (from scrapbook!) -->
    <g transform="translate(85, 150) rotate(-4)">
      <rect x="-18" y="-12" width="36" height="24" fill="#FFD84D" stroke="#292521" stroke-width="1.8" filter="url(#mom-shadow)"/>
      <rect x="-10" y="-15" width="20" height="5" fill="rgba(255, 248, 232, 0.8)" stroke="#292521" stroke-width="1" transform="rotate(3)"/>
      <text x="0" y="-2" font-family="sans-serif" font-size="4.5" font-weight="800" text-anchor="middle" fill="#292521">DEFAULT</text>
      <text x="0" y="4" font-family="sans-serif" font-size="4.5" font-weight="800" text-anchor="middle" fill="#292521">WORKER</text>
      <text x="0" y="9" font-family="sans-serif" font-size="4" font-weight="900" text-anchor="middle" fill="#FF5B55">#001</text>
    </g>
  </g>

  <!-- Mom Head & Messy Bun (Tired but peaceful!) -->
  <g id="mom-head">
    <!-- Neck -->
    <rect x="92" y="92" width="16" height="22" fill="#FAD2B8" stroke="#292521" stroke-width="2"/>

    <!-- Head Oval -->
    <path d="M 82 82 C 78 55 98 42 112 45 C 126 48 132 65 128 85 C 124 100 110 105 95 102 C 86 100 82 92 82 82 Z" 
          fill="#FAD2B8" stroke="#292521" stroke-width="2.5" stroke-linejoin="round" filter="url(#mom-shadow)"/>

    <!-- Messy Bun Hairdo (Signature from scrapbook) -->
    <!-- Top Messy Bun -->
    <circle cx="112" cy="28" r="16" fill="#6D4C3D" stroke="#292521" stroke-width="2.5" filter="url(#mom-shadow)"/>
    <circle cx="118" cy="22" r="10" fill="#7D5846" stroke="#292521" stroke-width="2"/>
    <!-- Hair sticks / pencil through bun -->
    <line x1="92" y1="35" x2="135" y2="16" stroke="#FF719A" stroke-width="3" stroke-linecap="round"/>
    <circle cx="92" cy="35" r="2" fill="#FFD84D"/>

    <!-- Main Hair volume around face -->
    <path d="M 80 75 C 72 50 90 35 110 38 C 126 40 134 55 132 75 C 128 65 125 55 110 52 C 95 50 85 62 80 75 Z" 
          fill="#6D4C3D" stroke="#292521" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M 78 72 Q 74 88 80 94" fill="none" stroke="#6D4C3D" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 128 72 Q 134 86 128 92" fill="none" stroke="#6D4C3D" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Tired, Gentle Eyes (Calmly closed / looking down at knitting) -->
    <path d="M 90 74 Q 96 79 101 74" fill="none" stroke="#292521" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 108 74 Q 114 79 119 74" fill="none" stroke="#292521" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Tired cute eyebags (subtle, relatable mom look!) -->
    <path d="M 89 79 Q 95 83 100 79" fill="none" stroke="#C89B68" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M 108 79 Q 114 83 118 79" fill="none" stroke="#C89B68" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Calm soft smile -->
    <path d="M 100 89 Q 106 93 111 89" fill="none" stroke="#292521" stroke-width="2" stroke-linecap="round"/>
    <!-- Peach cheeks -->
    <circle cx="88" cy="83" r="4" fill="#FF719A" opacity="0.4"/>
    <circle cx="121" cy="83" r="4" fill="#FF719A" opacity="0.4"/>
  </g>

  <!-- Mom Arms & Animated Knitting Action! -->
  <g id="mom-knitting-arms">
    <!-- Left Hand & Knitting Needle -->
    <g id="mom-needle-left" style="transform-origin: 90px 145px;">
      <!-- Arm -->
      <path d="M 72 135 Q 85 155 98 148" fill="none" stroke="#9E9E9E" stroke-width="12" stroke-linecap="round"/>
      <!-- Hand -->
      <circle cx="100" cy="148" r="6" fill="#FAD2B8" stroke="#292521" stroke-width="1.5"/>
      <!-- Needle A -->
      <line x1="85" y1="160" x2="130" y2="130" stroke="#55B9F5" stroke-width="3" stroke-linecap="round"/>
      <circle cx="84" cy="161" r="3" fill="#FFD84D" stroke="#292521" stroke-width="1"/>
    </g>

    <!-- Right Hand & Knitting Needle -->
    <g id="mom-needle-right" style="transform-origin: 125px 145px;">
      <!-- Arm -->
      <path d="M 135 135 Q 125 155 115 148" fill="none" stroke="#9E9E9E" stroke-width="12" stroke-linecap="round"/>
      <!-- Hand -->
      <circle cx="113" cy="148" r="6" fill="#FAD2B8" stroke="#292521" stroke-width="1.5"/>
      <!-- Needle B -->
      <line x1="130" y1="160" x2="85" y2="130" stroke="#55B9F5" stroke-width="3" stroke-linecap="round"/>
      <circle cx="131" cy="161" r="3" fill="#FFD84D" stroke="#292521" stroke-width="1"/>
    </g>

    <!-- Sweater being knitted (growing baby pastel sweater!) -->
    <g id="mom-knitted-piece" transform="translate(95, 145)">
      <path d="M -8 2 Q 10 -4 28 2 L 25 36 Q 10 40 -5 36 Z" fill="#FF719A" stroke="#292521" stroke-width="2" filter="url(#mom-shadow)"/>
      <!-- Striped yarn knit pattern -->
      <line x1="-6" y1="10" x2="26" y2="10" stroke="#FFF8E8" stroke-width="2" stroke-dasharray="3 2"/>
      <line x1="-5" y1="18" x2="25" y2="18" stroke="#B8E986" stroke-width="2" stroke-dasharray="3 2"/>
      <line x1="-4" y1="26" x2="24" y2="26" stroke="#FFD84D" stroke-width="2" stroke-dasharray="3 2"/>
    </g>

    <!-- Ball of Yarn on the floor with trailing string -->
    <g id="mom-yarn-basket" transform="translate(150, 195)">
      <circle cx="16" cy="16" r="15" fill="#FF719A" stroke="#292521" stroke-width="2.5" filter="url(#mom-shadow)"/>
      <path d="M 5 12 Q 16 7 27 12 M 7 20 Q 16 15 25 20 M 10 26 Q 16 22 22 26" fill="none" stroke="#FFA5C0" stroke-width="2" stroke-linecap="round"/>
      <!-- Trailing thread going to needles -->
      <path d="M 12 5 Q 0 -15 -35 -40" fill="none" stroke="#FF719A" stroke-width="2" stroke-dasharray="2 2"/>
    </g>
  </g>
</svg>